<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseChat - Real-Time Collaborative Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col font-sans overflow-hidden">

  <!-- Top App Navigation Bar -->
  <header class="bg-slate-950 border-b border-slate-800 px-6 py-3 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-500/20">
        <i class="fa-solid fa-comments"></i>
      </div>
      <div>
        <h1 class="font-bold text-base leading-none">PulseChat Enterprise</h1>
        <span class="text-xs text-slate-400">WebSocket Bi-Directional Collaboration Suite</span>
      </div>
    </div>

    <!-- Connection & User Badge -->
    <div class="flex items-center gap-4">
      <div id="connBadge" class="flex items-center gap-2 text-xs px-3 py-1 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20">
        <span id="connDot" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
        <span id="connText">Connecting to ws://localhost:8080...</span>
      </div>

      <div class="flex items-center gap-2 bg-slate-800 px-3 py-1 rounded-lg border border-slate-700">
        <i class="fa-solid fa-user text-indigo-400 text-xs"></i>
        <input id="usernameInput" type="text" value="Guest" class="bg-transparent text-xs font-semibold focus:outline-none w-28 text-slate-200" title="Click to rename yourself" />
        <button id="saveUsernameBtn" class="text-xs text-indigo-400 hover:text-indigo-300">Save</button>
      </div>
    </div>
  </header>

  <!-- Main Chat Body -->
  <div class="flex flex-1 overflow-hidden">
    <!-- Left Sidebar: Channels & Online Users -->
    <aside class="w-64 bg-slate-950/70 border-r border-slate-800 flex flex-col justify-between shrink-0">
      <div>
        <!-- Channels Section -->
        <div class="p-4">
          <span class="text-[11px] font-bold uppercase tracking-wider text-slate-500 px-2">Rooms / Channels</span>
          <div class="mt-2 space-y-1">
            <button onclick="switchChannel('general')" id="chan-general" class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium transition bg-indigo-600/20 text-indigo-300 border border-indigo-500/30">
              <i class="fa-solid fa-hashtag text-xs"></i> general
            </button>
            <button onclick="switchChannel('engineering')" id="chan-engineering" class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition">
              <i class="fa-solid fa-hashtag text-xs"></i> engineering
            </button>
            <button onclick="switchChannel('random')" id="chan-random" class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition">
              <i class="fa-solid fa-hashtag text-xs"></i> random
            </button>
          </div>
        </div>

        <!-- Online Users -->
        <div class="p-4 border-t border-slate-800/80">
          <div class="flex items-center justify-between px-2 mb-2">
            <span class="text-[11px] font-bold uppercase tracking-wider text-slate-500">Active Presence</span>
            <span id="userCount" class="text-xs bg-slate-800 px-1.5 py-0.5 rounded text-indigo-400 font-mono">1</span>
          </div>
          <ul id="userList" class="space-y-1.5 text-xs text-slate-300">
            <li class="flex items-center gap-2 px-2 py-1">
              <span class="w-2 h-2 rounded-full bg-emerald-400"></span> You
            </li>
          </ul>
        </div>
      </div>

      <!-- Tech Stack Footer Box -->
      <div class="p-4 border-t border-slate-800 text-[11px] text-slate-500">
        <p><strong class="text-slate-400">Protocol:</strong> Full-Duplex TCP WebSocket</p>
        <p><strong class="text-slate-400">Store:</strong> SQLite Persistent History</p>
      </div>
    </aside>

    <!-- Center: Chat Conversation Pane -->
    <main class="flex-1 flex flex-col bg-slate-900 justify-between overflow-hidden">
      <!-- Channel Header -->
      <div class="h-12 border-b border-slate-800 px-6 flex items-center justify-between bg-slate-900/60">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-hashtag text-indigo-400"></i>
          <span id="activeChannelName" class="font-bold text-slate-200">general</span>
        </div>
        <span class="text-xs text-slate-500">End-to-End WebSocket Stream</span>
      </div>

      <!-- Messages Message Container -->
      <div id="messagesContainer" class="flex-1 p-6 overflow-y-auto space-y-4"></div>

      <!-- Typing Indicator -->
      <div id="typingIndicator" class="px-6 h-5 text-xs text-indigo-400 italic opacity-0 transition-opacity flex items-center gap-1.5">
        <i class="fa-solid fa-pen-nib animate-bounce"></i> <span id="typingText"></span>
      </div>

      <!-- Message Input Bar -->
      <div class="p-4 bg-slate-950/60 border-t border-slate-800">
        <form id="chatForm" class="flex gap-3">
          <input 
            id="messageInput" 
            type="text" 
            placeholder="Type message into #general..." 
            autocomplete="off" 
            class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
          />
          <button 
            type="submit" 
            class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-5 py-2.5 rounded-xl text-sm transition shadow-lg shadow-indigo-600/30 flex items-center gap-2"
          >
            <span>Send</span>
            <i class="fa-solid fa-paper-plane text-xs"></i>
          </button>
        </form>
      </div>
    </main>
  </div>

  <!-- Modular Scripts -->
  <script src="js/config.js"></script>
  <script src="js/socket.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
